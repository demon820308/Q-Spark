name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.2.4)'
        required: true
        default: 'v0.2.4'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $rawVer = $tag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$rawVer" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version: $rawVer with tag: $tag"

      - name: Build Portable Windows Package
        shell: pwsh
        run: |
          python scripts/build_portable.py --version ${{ steps.release_info.outputs.version }}

      - name: Create GitHub Release and Upload Portable Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Q-Spark ${{ steps.release_info.outputs.tag }} - Windows x64 Portable
          body: |
            ## ⚡ Q-Spark ${{ steps.release_info.outputs.tag }} - 原生桌面守护宿主与 Agent 监控看板

            基于 `stable-diffusion.cpp` C++ 原生引擎构建的轻量、极速本地生图工作室，内置兼容 OpenAI 的 Agent 生图接口与即插即用 Agent Skill。

            ### 🚀 ${{ steps.release_info.outputs.tag }} 重磅升级 (Highlights)
            - **🛡️ 架构冲突精准排错与真实错误还原**：底层 C++ 报错真实还原（断言行精准提取），彻底解决吞错与误报问题；倒序精准捕获底层崩溃日志，保留任务启动规格与执行阶段步骤。
            - **🔬 NVFP4 非标量化精确诊断**：针对 Qwen 3.4B 原始权重中的 NVFP4 微块量化层（`scale_nelements` 校验失败），给出明确诊断提示与 `Fix-convert` 一键修复指引。
            - **🎨 VAE 兼容性 A + B 双重保障**：Layer A 事前预检（Pre-flight 架构错配预警）+ Layer B 事后异常捕获（Runtime 崩溃精准成套换回引导）。
            - **🖥️ 实时日志体验优化**：日志缓冲扩容至 120 行防止关键前置信息被顶出，紧凑追加错误信息，界面不再清空历史记录。
            - **⚙️ 移除隐式静默替换**：严格尊重用户手动选择的模型配置，不再暗中静默回退，让排错与配置完全透明。

            ### 📦 便携版特性 (Portable Highlights)
            - **零依赖开箱即用**：内置轻量独立 Python 3.12 绿色运行时与所有依赖，无需在系统中另外安装 Python！
            - **完整 CUDA 12 加速推理**：内置完整 CUDA 12 引擎 (`sd-cli.exe`, `ggml-cuda.dll`, `cublasLt64_12.dll` 等)。
            - **原生启动器**：内置 `Q-Spark.exe`，解压后双击直接起飞！

            ### 🚀 快速上手 (Quick Start)
            1. 下载下方的 `Q-Spark-${{ steps.release_info.outputs.version }}-windows-x64-portable.zip` 并解压；
            2. 将您下载的模型放入 `models/` 对应子目录（或在网页设置中指向已有的 ComfyUI/models 目录）；
            3. 双击 `Q-Spark.exe` 或 `start.bat` 即可启动并在浏览器自动打开控制台！
          files: Q-Spark-*-windows-x64-portable.zip
          draft: false
          prerelease: false
