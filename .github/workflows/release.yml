name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.2.3)'
        required: true
        default: 'v0.2.3'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $rawVer = $tag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$rawVer" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version: $rawVer with tag: $tag"

      - name: Build Portable Windows Package
        shell: pwsh
        run: |
          python scripts/build_portable.py --version ${{ steps.release_info.outputs.version }}

      - name: Create GitHub Release and Upload Portable Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Q-Spark ${{ steps.release_info.outputs.tag }} - Windows x64 Portable
          body: |
            ## ⚡ Q-Spark ${{ steps.release_info.outputs.tag }} - 原生桌面守护宿主与 Agent 监控看板

            基于 `stable-diffusion.cpp` C++ 原生引擎构建的轻量、极速本地生图工作室，内置兼容 OpenAI 的 Agent 生图接口与即插即用 Agent Skill。

            ### 🚀 ${{ steps.release_info.outputs.tag }} 重磅升级 (Highlights)
            - **🖥️ 原生桌面守护宿主与系统托盘 (`Q-Spark.exe`)**：精美沉浸式暗色原生 Shell 视窗，内置 Windows JobObject 操作系统级进程树护航，彻底告别僵尸进程与黑框终端。
            - **🛸 微信/网易云级托盘无缝交互**：点击最小化（`—`）或关闭（`×`）秒进系统托盘，后台服务稳定保持运行保障外部 Agent 接口不中断，双击托盘图标 0 延迟秒级唤醒；提供直观的顶部与托盘【🛑 退出程序】入口。
            - **🤖 外部 Agent 接入实时监控看板**：实时监听外部智能体（Claude Code, Cursor, Windsurf, Antigravity, Dify 等）调用动态；自适应长提示词多行展开与划选复制；内置现代几何暗色科技风 ON/OFF 滑动开关，默认完全静默（0 刷屏），支持按需长轮询与单次 `[⟳ 刷新]`。
            - **⚙️ 模型与配置双向热同步**：桌面宿主与 Web 端实时同步 `config.json`，主生图模型、文本编码器（TE）、VAE 与默认步数支持界面化热配置并自动架构成套纠偏。
            - **🛡️ 纯净独立环境隔离**：专有 Edge Profile 隔离机制，彻底消除多实例与 Chromium ProcessSingleton 冲突，开箱即用。

            ### 📦 便携版特性 (Portable Highlights)
            - **零依赖开箱即用**：内置轻量独立 Python 3.12 绿色运行时与所有依赖，无需在系统中另外安装 Python！
            - **完整 CUDA 12 加速推理**：内置完整 CUDA 12 引擎 (`sd-cli.exe`, `ggml-cuda.dll`, `cublasLt64_12.dll` 等)。
            - **原生启动器**：内置 `Q-Spark.exe`，解压后双击直接起飞！

            ### 🚀 快速上手 (Quick Start)
            1. 下载下方的 `Q-Spark-${{ steps.release_info.outputs.version }}-windows-x64-portable.zip` 并解压；
            2. 将您下载的模型放入 `models/` 对应子目录（或在网页设置中指向已有的 ComfyUI/models 目录）；
            3. 双击 `Q-Spark.exe` 或 `start.bat` 即可启动并在浏览器自动打开控制台！
          files: Q-Spark-*-windows-x64-portable.zip
          draft: false
          prerelease: false
