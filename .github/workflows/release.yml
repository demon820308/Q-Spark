name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $rawVer = $tag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$rawVer" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version: $rawVer with tag: $tag"

      - name: Build Portable Windows Package
        shell: pwsh
        run: |
          python scripts/build_portable.py --version ${{ steps.release_info.outputs.version }}

      - name: Create GitHub Release and Upload Portable Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Q-Spark ${{ steps.release_info.outputs.tag }} - Windows x64 Portable
          body: |
            ## ⚡ Q-Spark ${{ steps.release_info.outputs.tag }} - 原生视觉指令编辑与 Viggle Turbo 极速引擎

            基于 `stable-diffusion.cpp` C++ 原生引擎构建的轻量、极速本地生图工作室，内置兼容 OpenAI 的 Agent 生图接口。

            ### 🚀 ${{ steps.release_info.outputs.tag }} 重磅升级 (Highlights)
            - **🖼️ 原生多模态图像指令编辑 (Image Edit)**：告别传统 Canvas 蒙版涂抹，采用 Qwen 原生空噪声起步与视觉投射器（Vision Projector）完整采样去噪链路，支持多参考图自然语言指令交互（自动识别并映射 `<image1>` / `<image2>`）。
            - **⚡ 原生支持 Viggle Turbo 6-step 极速模型**：深度适配 6-step 与 8-step viggle-turbo 专属时间步 Sigmas 调度，纯 GPU 显存不溢出，极致出图效率。
            - **🧹 极简轻量重构**：全面清理历史画板废弃 DOM、残存样式与冗余参数，前后端代码链路极简纯粹。
            - **⏹️ 实时任务秒级中断**：支持前端一键终止与 `/api/task/stop` 接口，毫秒级终止子进程并释放 GPU 显存。

            ### 📦 便携版特性 (Portable Highlights)
            - **零依赖开箱即用**：内置轻量独立 Python 3.12 绿色运行时与所有依赖，无需在系统中另外安装 Python！
            - **完整 CUDA 12 加速推理**：内置完整 CUDA 12 引擎 (`sd-cli.exe`, `ggml-cuda.dll`, `cublasLt64_12.dll` 等)。
            - **原生启动器**：内置 `Q-Spark.exe`，解压后双击直接起飞！

            ### 🚀 快速上手 (Quick Start)
            1. 下载下方的 `Q-Spark-${{ steps.release_info.outputs.version }}-windows-x64-portable.zip` 并解压；
            2. 将您下载的模型放入 `models/` 对应子目录（或在网页设置中指向已有的 ComfyUI/models 目录）；
            3. 双击 `Q-Spark.exe` 或 `start.bat` 即可启动并在浏览器自动打开控制台！
          files: Q-Spark-*-windows-x64-portable.zip
          draft: false
          prerelease: false
