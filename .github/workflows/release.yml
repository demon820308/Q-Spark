name: Build & Release Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.2.7)'
        required: true
        default: 'v0.2.7'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Release Tag
        id: release_info
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $rawVer = $tag.TrimStart('v')
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "version=$rawVer" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version: $rawVer with tag: $tag"

      - name: Build Portable Windows Package
        shell: pwsh
        run: |
          python scripts/build_portable.py --version ${{ steps.release_info.outputs.version }}

      - name: Create GitHub Release and Upload Portable Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Q-Spark ${{ steps.release_info.outputs.tag }} - Windows x64 Portable
          body: |
            ## ⚡ Q-Spark ${{ steps.release_info.outputs.tag }} - 文本编码器静默自愈、Krea-2 Turbo 体系支持与可视化模型指南

            基于 `stable-diffusion.cpp` C++ 原生引擎构建的轻量、极速本地生图工作室，内置兼容 OpenAI 的 Agent 生图接口与即插即用 Agent Skill。

            ### 🚀 ${{ steps.release_info.outputs.tag }} 重磅升级 (Highlights)
            - **🧠 Qwen3-VL 文本编码器毫秒级静默自动对齐**：智能读取 safetensors 头部元数据（无需完整载入权重），自动识别 HuggingFace 原生 `model.language_model.` 键名并瞬时规范化生成兼容版 `_fixed.safetensors`，彻底告别 C++ 引擎报错，用户零心智负担。
            - **⚡ Krea-2 Turbo 体系全新原生支持**：全面支持 Krea AI 12B 单流 MMDiT 极速版（8步 Euler / simple 采样），原生集成 Qwen3-VL 4B 文本编码器与专用 VAE 解码器。
            - **📖 Web 控制台「模型搭配指南」可视化面板**：导航栏新增交互式模型搭配指南，以清晰卡片直观呈现主流体系（Qwen 2.1 Turbo GGUF、Qwen 2.1 UC INT8、Krea-2 Turbo、Z-Image Turbo、Qwen 原生版、Flux.1/2）的 DiT、TE、VAE 专属组合与步数建议。
            - **🎯 Turbo 调度策略精确优化与张量智能诊断**：解耦并精确区分 Qwen 2.1 专属 sigma 曲线与通用 Turbo / Viggle 调度逻辑；新增张量命名规范缺失的精确中文排错引导。
            - **🛠️ Fix-convert 兼容性工具箱扩充**：新增 `convert_qwen3vl.py` 及 `一键修复_Qwen3VL.bat` 离线拖拽转换脚本，满足离线预处理与批量分发需求。

            ### 📦 便携版特性 (Portable Highlights)
            - **零依赖开箱即用**：内置轻量独立 Python 3.12 绿色运行时与所有依赖，无需在系统中另外安装 Python！
            - **完整 CUDA 12 加速推理**：内置完整 CUDA 12 引擎 (`sd-cli.exe`, `ggml-cuda.dll`, `cublasLt64_12.dll` 等)。
            - **原生启动器**：内置 `Q-Spark.exe`，解压后双击直接起飞！

            ### 🚀 快速上手 (Quick Start)
            1. 下载下方的 `Q-Spark-${{ steps.release_info.outputs.version }}-windows-x64-portable.zip` 并解压；
            2. 将您下载的模型放入 `models/` 对应子目录（或在网页设置中指向已有的 ComfyUI/models 目录）；
            3. 双击 `Q-Spark.exe` 或 `start.bat` 即可启动并在浏览器自动打开控制台！
          files: Q-Spark-*-windows-x64-portable.zip
          draft: false
          prerelease: false
